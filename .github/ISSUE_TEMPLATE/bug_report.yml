name: Bug report
description: Report a reproducible problem in the app or CLI.
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Do not include secrets, private project files, model weights, or sensitive logs. For vulnerabilities, read SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, OS, architecture, app or CLI, and model if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps or commands; use the public demo when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a redacted error or screenshot if helpful.
    validations:
      required: true
