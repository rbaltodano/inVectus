[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
incremental = false
