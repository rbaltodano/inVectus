[package]
license.workspace = true
name = "invectus-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "invectus"
path = "src/main.rs"

[dependencies]
invectus-core.workspace = true
invectus-ingest.workspace = true
invectus-embed.workspace = true
invectus-index.workspace = true
invectus-unsearch.workspace = true
invectus-regions.workspace = true
invectus-gaps.workspace = true
invectus-eval.workspace = true
invectus-llm.workspace = true
invectus-midpoint.workspace = true
invectus-verify.workspace = true
invectus-orchestration.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ctrlc.workspace = true
tempfile.workspace = true
# Build extension archives on every platform without system zip/unzip tools.
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2"] }
# Select flate2's pure Rust backend without the unrelated archive codecs.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[features]
# The full CLI runs the local language model; the agent edition builds without it:
# `cargo build --release -p invectus-cli --no-default-features`.
default = ["local-model"]
local-model = ["invectus-llm/local-model"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
