[package]
license.workspace = true
name = "invectus-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
duckdb.workspace = true
# Direct dependency only for DEP_DUCKDB_INCLUDE (build.rs); same version as `duckdb` pins.
libduckdb-sys = { version = "=1.20000.0", default-features = false }
keyring.workspace = true
url.workspace = true
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile.workspace = true
