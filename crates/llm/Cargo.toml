[package]
license.workspace = true
name = "invectus-llm"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
llama-cpp-2 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["metal"], optional = true }

[features]
# llama.cpp for local generation. Off in the agent edition (`--no-default-features` on the CLI).
default = ["local-model"]
local-model = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile.workspace = true
