[package]
name = "invectus-app"
version = "0.1.0"
publish = false
description = "inVectus desktop shell"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "invectus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
dirs.workspace = true
futures.workspace = true

invectus-core.workspace = true
invectus-ingest.workspace = true
invectus-embed.workspace = true
invectus-index.workspace = true
invectus-unsearch.workspace = true

[dev-dependencies]
tempfile.workspace = true
